[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gillm"
version = "0.1.15"
description = "GUI Control Plugin with NLP & Intent Contracts"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "requests>=2.31.0",
    "mss>=9.0",
]

[project.optional-dependencies]
control = [
    "dsl2gillm>=0.1.0",
    "uri2gillm>=0.1.0",
    "nlp2gillm>=0.1.0",
    "cli2gillm>=0.1.0",
    "mcp2gillm>=0.1.0",
    "rest2gillm>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
    "dsl2gillm>=0.1.0",
    "uri2gillm>=0.1.0",
    "nlp2gillm>=0.1.0",
    "rest2gillm>=0.1.0",
]

[project.scripts]
gillm = "gillm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = [
    "packages/dsl2gillm",
    "packages/uri2gillm",
    "packages/nlp2gillm",
    "packages/cli2gillm",
    "packages/mcp2gillm",
    "packages/rest2gillm",
]

[tool.uv.sources]
dsl2gillm = { workspace = true }
uri2gillm = { workspace = true }
nlp2gillm = { workspace = true }
cli2gillm = { workspace = true }
mcp2gillm = { workspace = true }
rest2gillm = { workspace = true }

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
