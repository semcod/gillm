[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp2gillm"
version = "0.1.0"
description = "Natural language → dsl2gillm command lines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "dsl2gillm>=0.1.0",
    "jsonschema>=4.21",
    "uri2gillm>=0.1.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.51,<2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
nlp2gillm = "nlp2gillm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nlp2gillm = [
    "contracts/v1/*.gbnf",
    "contracts/v1/*.json",
    "contracts/v1/*.proto",
]

[tool.uv.sources]
dsl2gillm = { workspace = true }
uri2gillm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
