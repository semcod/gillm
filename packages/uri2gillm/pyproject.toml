[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uri2gillm"
version = "0.1.0"
description = "gillm:// URI → dsl2gillm dispatch"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "dsl2gillm>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uri2gillm = "uri2gillm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
dsl2gillm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
